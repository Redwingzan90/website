# Netlify configuration — KORR Building Co.
#
# The site is plain static files with no build step.
#
# publish points at site/, which is the whole safety model here. The repo root
# used to be the web root, so every working file — the photo inbox, the HTML
# backups, the data snapshots — was publicly fetchable, and the only thing
# stopping them shipping was a hand-maintained list of 404 redirects below.
# Miss one and it goes live. Now a file is private unless somebody deliberately
# puts it in site/, and nothing has to be remembered.

[build]
  publish = "site"
  command = ""

# Long-lived caching for fingerprint-stable assets, none for the document.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
