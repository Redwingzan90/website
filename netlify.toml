# Netlify configuration — KORR Building Co.
# The site is plain static files with no build step, published from the repo root.

[build]
  publish = "."
  command = ""

# The repo root is the web root, so internal working files would otherwise be
# publicly fetchable. Serve them as 404 instead.
[[redirects]]
  from = "/PRODUCT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data.snapshot.json"
  to = "/404.html"
  status = 404
  force = true

# Long-lived caching for fingerprint-stable assets, none for the document.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
